name: test

# Unlike most suites, these tests MUTATE THE RUNNER'S FIREWALL. That is safe here
# only because the runner is ephemeral — never point this at a self-hosted runner
# you care about.
#
# ufw defaults to "allow outgoing", and the Actions agent talks outbound, so
# enabling a default-deny-incoming firewall does not cut the job off. The suite
# also calls `ufw-docker rescue` in teardown, so a failure cannot wedge the job.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Callable, so release.yml runs THE SAME gates rather than a copy of them.
  # A release pipeline with its own slightly-different checks is a release
  # pipeline that eventually ships something main would have rejected.
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    # PINNED, like every other job here. `ubuntu-latest` is a moving label --
    # GitHub is rolling it from 24.04 to 26.04 through November 2026 -- so it
    # silently changes the kernel and the toolchain under a suite whose entire
    # purpose is detecting environment differences. Worse, during a partial
    # rollout two jobs in the SAME run can land on different images, which is
    # a variable nothing in the logs would have explained.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: syntax
        run: |
          for f in ufw-docker tests/netns-probe.sh tests/container-leg.sh tests/leg-coldboot.sh tests/leg-rootless.sh tests/leg-load.sh tests/leg-summary.sh tests/render-matrix.sh tests/ufw-ipv6-selftest.sh tests/lint-sanitize.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: the operator-rule invariant actually fires
        # Proves the suite's central safety check is not vacuous. Pure logic
        # against synthetic inputs -- touches no firewall, so it belongs here
        # in the fast job rather than in bats.
        run: tests/invariant-selftest.sh

      - name: functions defined, dispatcher and usage agree
        # Gating, not advisory: this catches a helper silently dropped by a
        # refactor, which bash -n and shellcheck both pass. It has happened.
        run: tests/lint-functions.sh

      - name: version metadata is consistent
        # On a tag build this also asserts the tag and VERSION agree. On main
        # it checks the half that is always checkable: that the stanza still
        # records $VERSION, which `status` reads back to tell an operator
        # which version wired their host.
        run: tests/lint-version.sh

      - name: the SSH-permission matcher finds every form of permission
        # `rescue` decides whether to touch SSH from this matcher. It used to
        # look for `--dport <port>` only, so a host whose SSH was allowed by
        # INTERFACE read as "no SSH rule" and got the port opened to the world
        # unattended at boot. Pure logic, no firewall -- it belongs here.
        run: tests/ssh-detect-selftest.sh

      - name: Docker's firewall backend is classified correctly
        # moby's nftables backend has NO DOCKER-USER chain -- setupUserChains()
        # returns early when nftables is enabled -- so the whole design is
        # inert there and the tool must refuse. That refusal path cannot be
        # exercised in a leg (it needs a daemon restart with a changed
        # daemon.json), so the classification is tested as pure logic here.
        run: tests/firewall-backend-selftest.sh

      - name: ufw's own IPv6 switch is read correctly
        # With IPV6=no in /etc/default/ufw, ufw never loads after6.rules -- so
        # a v6 stanza we write is dead text and v6 into containers is
        # unfiltered. `status` used to report only the symptom ("IPv6 is NOT
        # wired"), leaving the operator to guess. The interesting cases are
        # malformed config lines, which are text, so they are tested here
        # rather than by editing a live host's ufw config per case.
        run: tests/ufw-ipv6-selftest.sh

      - name: nothing identifying is committed
        # This repository is going PUBLIC, and a one-time scan before the flip
        # is not enough -- what puts a real address in a file is pasting real
        # terminal output into a doc, which happens continuously. So it gates.
        #
        # It found three on the first run, all pasted output nobody meant to
        # commit: the dev host's own public address hardcoded as HOSTIP=, the
        # maintainer's SSH source address in a sample `status` transcript
        # (published as "this address may SSH to us"), and a real routable
        # address used as the internet end of a DNAT diagram.
        run: tests/lint-sanitize.sh

      - name: the platform matrix and the docs agree
        # Two copies of the matrix exist on purpose -- the heredoc in
        # `ufw-docker`, because the preflight must read it on a host that
        # downloaded only that file, and docs/supported.md, because that is
        # what people read. Two copies drift. A docs row claiming `supported`
        # for something nothing has proven is the dangerous direction, so this
        # gates rather than warns. Pure text: no root, no Docker, no firewall.
        run: tests/lint-supported.sh

      - name: shellcheck
        # Gating, not advisory. It was `|| true`, which meant it could never fail
        # the build -- and the file is clean at this level, so there is nothing
        # to grandfather in. Lower the severity rather than restoring `|| true`
        # if that ever stops being true.
        run: shellcheck -S warning ufw-docker tools/ufw-docker-survey tests/netns-probe.sh tests/run.sh tests/invariant-selftest.sh tests/lint-functions.sh tests/lint-supported.sh tests/ssh-detect-selftest.sh tests/firewall-backend-selftest.sh tests/ufw-ipv6-selftest.sh tests/lint-sanitize.sh tests/lint-version.sh tests/cold-boot-check.sh tests/container-leg.sh tests/leg-coldboot.sh tests/leg-rootless.sh tests/leg-load.sh tests/leg-summary.sh tests/render-matrix.sh

      - name: Record this job's result for the README table
        if: always()
        # LAST in this job on purpose. `job.status` reflects the steps that
        # have already run, so placing this before the shellcheck step would
        # have recorded `pass` for a job shellcheck was about to fail.
        run: |
          st=pass; [ "${{ job.status }}" = success ] || st=fail
          mkdir -p "$RUNNER_TEMP/result"
          printf 'lint\t%s\t-\t%s\t%s\t%s\t%s\n' \
            'shellcheck, syntax and 8 pure-logic gates' 'ubuntu-24.04' "$(uname -r)" "$st" \
            'invariant, functions, version, SSH matcher, firewall backend, ufw IPv6 switch, nothing identifying, platform matrix' \
            > "$RUNNER_TEMP/result/lint.tsv"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-lint
          path: ${{ runner.temp }}/result/*.tsv
          retention-days: 7
          if-no-files-found: warn

  bats:
    runs-on: ${{ matrix.runner }}
    # Was 15, and a run that failed late then spent 13 minutes in teardown got
    # CANCELLED instead of reporting -- losing the diagnostics that would have
    # explained the failure. The teardown is now bounded too (see run.sh).
    timeout-minutes: 25
    strategy:
      # Explicit legs rather than a full cross product, so each one is here on
      # purpose and the cost is visible.
      #
      #   ipv6 OFF / nft     the common production case. Docker installs its own
      #                      raw/PREROUTING DROP ahead of FORWARD, so the v6
      #                      stanza is written but never consulted.
      #   ipv6 ON  / nft     the case where the v6 stanza actually decides.
      #   ipv6 OFF / legacy  the real xtables backend, which Debian 10/11 and
      #                      older Ubuntu default to and which update-alternatives
      #                      can still select on 12. Everything this project has
      #                      ever verified ran on nf_tables, and at least one
      #                      measured behaviour differs between them (see below).
      #   ipv6 ON  / legacy  NEW. v6 had only ever run on nf_tables, so every v6
      #                      claim this project makes rested on one backend.
      #
      # THE `runner` AXIS IS THE KERNEL AXIS. Every leg in this workflow used to
      # say `ubuntu-latest`, which meant all fourteen jobs shared one kernel --
      # and a container leg cannot vary it, because a container has no kernel of
      # its own. Pinning two different images is the only kernel breadth
      # available without booting a VM, so it is spent deliberately:
      #
      #   - legs 1 and 2 are the SAME configuration on different runners. That
      #     pair is the control: a failure on exactly one of them is a kernel
      #     difference and nothing else.
      #   - the rest spread backend and IPv6 across both images so neither is
      #     locked to a single kernel.
      #
      # Both are still modern kernels. Debian 10's own 4.19 is not reachable
      # this way -- see docs/testing.md.
      fail-fast: false
      matrix:
        include:
          - docker_ipv6: false
            iptables: nft
            runner: ubuntu-24.04
          - docker_ipv6: false
            iptables: nft
            runner: ubuntu-22.04
          - docker_ipv6: true
            iptables: nft
            runner: ubuntu-24.04
          - docker_ipv6: true
            iptables: legacy
            runner: ubuntu-22.04
          - docker_ipv6: false
            iptables: legacy
            runner: ubuntu-24.04
    name: bats (ipv6=${{ matrix.docker_ipv6 }}, iptables=${{ matrix.iptables }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade test installs THE PREVIOUS REVISION of ufw-docker out
          # of git and runs the current one over it. A shallow clone has no
          # previous revision, so the test would skip -- quietly, on every run,
          # which is the shape of untested-but-green this suite keeps finding.
          fetch-depth: 0

      - name: Record the kernel this leg actually ran on
        # Printed AND recorded. The README table carries this column because
        # "which kernel was that?" is otherwise unanswerable after the fact,
        # and it is the one axis these legs cannot vary.
        run: |
          echo "runner image : ${{ matrix.runner }}"
          echo "kernel       : $(uname -r)"
          echo "KERNEL=$(uname -r)" >> "$GITHUB_ENV"

      - name: Select the iptables backend
        # FIRST, before ufw is enabled and before Docker builds any chains --
        # switching afterwards would leave rules stranded in the other backend.
        # Docker is restarted so it recreates DOCKER-USER and friends under the
        # selected one.
        #
        # Known difference this leg is expected to expose: `iptables-restore
        # --test` accepts `-j NOSUCHCHAIN` with rc=0 under nf_tables and is
        # expected to REJECT it under legacy. One test asserts the nft
        # behaviour, so if it fails here that is the finding, not a defect --
        # see tests/ufw-docker.bats.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables nftables
          if [ "${{ matrix.iptables }}" = legacy ]; then
            sudo update-alternatives --set iptables  /usr/sbin/iptables-legacy
            sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy

            # A11: the switch alone is NOT enough, and this is what the leg has
            # been failing on. The runner boots with Docker's chains already in
            # the nft subsystem. Changing the alternative only changes which
            # binary WE then talk to -- it does not remove what is already
            # there, and the kernel evaluates BOTH. A DROP in the nft ruleset
            # therefore still wins over an ACCEPT we add via legacy, which is
            # exactly the observed symptom: every "should be OPEN" assertion
            # failed while every "should be BLOCKED" one passed.
            #
            # This is the same hazard X1's mixed-backend check refuses on a
            # real host; here we deliberately create a clean single-backend
            # host instead.
            sudo nft flush ruleset || true
            sudo systemctl restart docker
            sleep 10
          fi
          iptables --version
          echo "--- legacy rules ---"; sudo iptables-legacy -S 2>/dev/null | grep -c '^-A' || true
          echo "--- nft rules ---";    sudo iptables-nft    -S 2>/dev/null | grep -c '^-A' || true
          sudo iptables -S | head -5

      - name: Enable IPv6 in the Docker daemon
        if: matrix.docker_ipv6
        # ULA only -- the runner has no global IPv6 and does not need one. The
        # probe reaches the container through the host end of a veth, which is
        # a destination Docker has DNAT'd.
        run: |
          sudo mkdir -p /etc/docker
          echo '{"ipv6": true, "ip6tables": true, "fixed-cidr-v6": "fd00:dead:beef::/64"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 10
          docker network inspect bridge --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}'

      - name: Install ufw, and ONE pinned bats
        # The distro legs have pinned bats v1.11.1 from source since they were
        # written (see tests/containers/Dockerfile, which lists the per-distro
        # drift: debian:10 ships bats 0.4.0, which is not even bats-core).
        # This job used apt's, which was fine while it only ever ran on one
        # runner image -- but apt gives 1.10.0 on ubuntu-24.04 and **1.2.1 on
        # ubuntu-22.04**, and this suite needs $BATS_FILE_TMPDIR, which arrived
        # in 1.4.0. So the moment a 22.04 leg was added, apt's bats would have
        # failed the whole suite for a reason that has nothing to do with the
        # tool.
        #
        # Pinning here also removes an inconsistency that already existed: the
        # legs and this job were running the same tests under two different
        # measuring instruments.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ufw
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          rm -rf /tmp/bats-core
          bats --version

      - name: Install ufw-docker
        # Installed BEFORE anything else so the suite teardown can always reach
        # it, including when a test fails early.
        run: sudo install -m 0755 ufw-docker /usr/local/sbin/ufw-docker

      # NOTE: there is deliberately no step here bringing up the container the
      # tests probe. There used to be, publishing 8089:8089, and the suite
      # relied on it -- which meant a LOCAL run had no such container and fell
      # through to whatever happened to answer on 8089. On a UISP host that is
      # unms-nginx, so the suite probed the operator's own service and deleted
      # their rule for it. setup_file now creates the container itself, on
      # 19089, so CI and local exercise the identical path. See start_testsvc().

      - name: Allow SSH and enable ufw
        # The suite asserts on an SSH rule as the canary for a half-built firewall,
        # so one must exist before it starts.
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Mark this runner as safe to disrupt
        # tests/run.sh refuses to run without this. Runners are disposable, so
        # the answer here is always yes -- but it has to be said out loud,
        # which is the whole point of the marker.
        run: sudo touch /etc/ufw-docker-tests-allowed

      - name: Run the suite
        # MEASURED, not guessed: ~4.5 min per nft leg for the suite (runs
        # 39863384004 and later). The old comment here said "~2 minutes", which
        # had quietly stopped being true -- and the whole point of this note is
        # to tell the next person whether a slow run means a hang.
        #
        # Most of the time is `install`, which the suite runs ~20 times. It
        # costs ~1s on a runner with one container and ~8s on the development
        # host, which has fifteen -- so a local run taking 10+ minutes is the
        # environment, not a regression.
        timeout-minutes: 12
        env:
          # The runner's own primary address — what the netns probe targets.
          HOST_IP: ""
        run: |
          # pipefail, or `tee` would hand back its own exit status and a
          # failing suite would report success. The log is teed because the
          # README table reports the TAP counts, and deriving them from the
          # same text a human reads means the two cannot disagree.
          set -o pipefail
          HOST_IP=$(ip -4 -br addr show scope global | awk 'NR==1{print $3}' | cut -d/ -f1)
          echo "probing $HOST_IP"
          sudo HOST_IP="$HOST_IP" tests/run.sh --tap 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Record this leg's result for the README table
        if: always()
        # always(), so a FAILING leg still reports -- a status table that only
        # ever records passes is decoration. `continue-on-error` is deliberately
        # NOT set: this step must not be able to turn a red leg green.
        run: |
          st=pass; [ "${{ job.status }}" = success ] || st=fail
          notes="$(tests/leg-summary.sh "$RUNNER_TEMP/suite.log" 2>/dev/null || echo 'no log')"
          mkdir -p "$RUNNER_TEMP/result"
          printf 'native\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            '${{ matrix.docker_ipv6 }}' '${{ matrix.iptables }}' '${{ matrix.runner }}' \
            "${KERNEL:-unknown}" "$st" "$notes" > "$RUNNER_TEMP/result/native.tsv"
          cat "$RUNNER_TEMP/result/native.tsv"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-native-${{ matrix.docker_ipv6 }}-${{ matrix.iptables }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/result/*.tsv
          retention-days: 7
          if-no-files-found: warn

      - name: Firewall state on failure
        if: failure()
        run: |
          sudo ufw status verbose || true
          sudo iptables -S DOCKER-USER || true
          sudo iptables -S ufw-user-input || true
          sudo iptables -S | grep -cE '^-N ufw.*logging' || true

      - name: Always leave the runner sane
        if: always()
        # BOUNDED. This is the third rescue a failing run reaches (bats
        # teardown_file, then run.sh's trap, then here). All three were
        # unbounded, and a run whose firewall was genuinely broken spent the
        # rest of the job's time budget in them -- the suite itself finished in
        # about two minutes, then the job sat for thirteen more and was
        # cancelled, taking the diagnostics with it.
        timeout-minutes: 5
        run: sudo timeout 180 /usr/local/sbin/ufw-docker rescue || true

  distro:
    # ── THE REAL-WORLD MATRIX ──────────────────────────────────────────────
    # The `bats` job above tests ONE environment: Ubuntu 24.04 with iptables
    # 1.8.10, because that is what a GitHub runner is. Nothing in the fleet
    # runs it. Debian 12 / iptables 1.8.9 was verified only by a human running
    # the suite by hand on one host -- strong evidence, but not per-push, so a
    # Debian-only regression reached `main` green.
    #
    # Each leg here boots a REAL distribution with systemd as pid 1 and its own
    # Docker daemon, inside one privileged container, and runs the identical
    # suite. See tests/containers/Dockerfile for what is real in there and what
    # is not -- the kernel is shared, and that limit is stated in
    # docs/supported.md rather than papered over.
    #
    # The legs are not interchangeable with the `bats` job and do not replace
    # it: that one has the IPv6 coverage, which needs daemon-level `ip6tables`
    # and is left on the native runner.
    #
    # THE RUNNER IS THE KERNEL, and a container cannot bring its own. Splitting
    # on the backend gives every base BOTH kernels (each base runs nft and
    # legacy), at zero extra cost -- no added jobs, no longer wall clock.
    #
    # The confound is real and worth stating: backend and kernel now vary
    # together, so a single red leg cannot by itself tell you which one did it.
    # Two things resolve that. A kernel-specific fault hits all five legs of one
    # backend, which is a distinctive signature; and the `bats` job runs the
    # identical configuration on both images as a deliberate control.
    runs-on: ${{ matrix.backend == 'nft' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    env:
      # The same expression is needed by `runs-on`, the kernel banner and the
      # result row. Written once here so the three cannot drift -- `runs-on`
      # itself cannot read a job-level env, so that one copy is unavoidable.
      RUNNER_IMAGE: ${{ matrix.backend == 'nft' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    # MEASURED on the development host: ~12 min for a leg, of which roughly two
    # are the image build and the rest is the suite itself. A GitHub runner has
    # fewer cores, so this is deliberately generous -- the failure mode to avoid
    # is a cancelled job, which takes the diagnostics with it and tells you
    # nothing. That has already cost this project two runs.
    #
    # Raised from 45 when the three post-suite phases landed. They add a few
    # minutes each: the rootless phase installs packages, the cold-boot phase
    # restarts the container init and waits for systemd twice.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Full cross product of the distributions anyone actually runs this on
        # against both iptables backends. The pairing matters as much as either
        # axis: the daemon is the DISTRO'S own, so an old iptables is tested
        # with the old Docker that ships beside it, which is the combination
        # that exists in the wild.
        #
        #   debian:10   iptables 1.8.2   the oldest thing plausibly still out there
        #   debian:11   iptables 1.8.7
        #   debian:12   iptables 1.8.9   dev-00 and site-00 -- the fleet
        #   ubuntu:22.04 iptables 1.8.7
        #   ubuntu:24.04 iptables 1.8.10 the same version the native job runs,
        #                                which is the point: it cross-checks
        #                                the harness against a known result.
        base: [ 'debian:10', 'debian:11', 'debian:12', 'ubuntu:22.04', 'ubuntu:24.04' ]
        backend: [ nft, legacy ]
    name: distro (${{ matrix.base }}, ${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v4
        with:
          # So the leg's upgrade test can read the previous revision of the
          # tool out of git rather than skipping.
          fetch-depth: 0

      - name: Record the kernel this leg actually ran on
        run: |
          echo "runner image : $RUNNER_IMAGE"
          echo "kernel       : $(uname -r)   <- SHARED with the container; ${{ matrix.base }} does not bring its own"
          echo "KERNEL=$(uname -r)" >> "$GITHUB_ENV"

      - name: Run the suite inside ${{ matrix.base }} / ${{ matrix.backend }}
        # No marker file and no `sudo ufw --force enable` on the RUNNER: the
        # nested container has its own network namespace, netfilter state is
        # per-namespace, and everything the suite does is confined to it. This
        # job never touches the runner's own firewall, which is why it needs
        # none of the native job's guard rails.
        run: |
          set -o pipefail
          tests/container-leg.sh '${{ matrix.base }}' '${{ matrix.backend }}' 2>&1 \
            | tee "$RUNNER_TEMP/leg.log"

      - name: Record this leg's result for the README table
        if: always()
        # The notes column is the point of this whole mechanism. Two
        # consecutive runs were green while the rootless phase skipped on ALL
        # TEN legs -- "success" and zero coverage are indistinguishable from a
        # tick. leg-summary.sh reports the per-phase counts so they are not.
        run: |
          st=pass; [ "${{ job.status }}" = success ] || st=fail
          notes="$(tests/leg-summary.sh "$RUNNER_TEMP/leg.log" 2>/dev/null || echo 'no log')"
          mkdir -p "$RUNNER_TEMP/result"
          printf 'distro\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            '${{ matrix.base }}' '${{ matrix.backend }}' "$RUNNER_IMAGE" \
            "${KERNEL:-unknown}" "$st" "$notes" > "$RUNNER_TEMP/result/distro.tsv"
          cat "$RUNNER_TEMP/result/distro.tsv"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-distro-${{ matrix.base }}-${{ matrix.backend }}
          path: ${{ runner.temp }}/result/*.tsv
          retention-days: 7
          if-no-files-found: warn

  coverage:
    # ── LINE COVERAGE OF `ufw-docker` ──────────────────────────────────────
    # kcov traces bash through bats' subshells (verified), so this is the real
    # suite exercising the real tool, not a proxy.
    #
    # ADVISORY, NOT GATING, and that is a deliberate choice rather than
    # laziness. A coverage threshold on a tool like this rewards the wrong
    # thing: the lines hardest to cover are `rescue`, the preflight refusals
    # and the error paths -- exactly the code whose tests need a broken host to
    # be meaningful. Chasing a number would push those toward shallow tests
    # that execute a line without asserting anything, which is how a suite
    # starts looking healthier than it is. The number is reported so a DROP is
    # visible; it is not allowed to fail the build.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ufw, kcov, and the same pinned bats
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ufw kcov
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          rm -rf /tmp/bats-core
          bats --version
          kcov --version

      - name: Install ufw-docker
        run: sudo install -m 0755 ufw-docker /usr/local/sbin/ufw-docker

      - name: Allow SSH and enable ufw
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable

      - name: Mark this runner as safe to disrupt
        run: sudo touch /etc/ufw-docker-tests-allowed

      - name: Run the suite under kcov
        id: cov
        # --include-pattern catches BOTH copies of the tool: the repo one most
        # tests invoke and /usr/local/sbin/ufw-docker that the self-heal tests
        # use. --exclude-pattern keeps the .bats file itself out, or the suite
        # would be measuring its own coverage.
        run: |
          set -o pipefail
          HOST_IP=$(ip -4 -br addr show scope global | awk 'NR==1{print $3}' | cut -d/ -f1)
          sudo HOST_IP="$HOST_IP" kcov \
            --include-pattern=ufw-docker \
            --exclude-pattern=.bats,/tests/,/docs/ \
            --bash-dont-parse-binary-dir \
            "$RUNNER_TEMP/cov" tests/run.sh --tap 2>&1 | tail -40 || true

      - name: Report the number
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          json="$(find "$RUNNER_TEMP/cov" -name coverage.json 2>/dev/null | head -1)"
          if [ -z "$json" ]; then
            # Say so plainly rather than reporting 0%, which would read as a
            # catastrophic regression instead of "the tool did not run".
            printf 'coverage\tline coverage of ufw-docker\t-\tubuntu-24.04\t%s\tskip\tkcov produced no report\n' \
              "$(uname -r)" > "$RUNNER_TEMP/result/coverage.tsv"
          else
            pct=$(grep -o '"percent_covered"[^,]*' "$json" | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
            cov=$(grep -o '"covered_lines"[^,]*' "$json" | tail -1 | grep -oE '[0-9]+' | head -1)
            tot=$(grep -o '"total_lines"[^,]*'   "$json" | tail -1 | grep -oE '[0-9]+' | head -1)
            echo "coverage: ${pct}% (${cov}/${tot} executable lines)"
            printf 'coverage\tline coverage of ufw-docker\t-\tubuntu-24.04\t%s\tpass\t%s%% (%s of %s executable lines)\n' \
              "$(uname -r)" "${pct:-?}" "${cov:-?}" "${tot:-?}" > "$RUNNER_TEMP/result/coverage.tsv"
          fi
          cat "$RUNNER_TEMP/result/coverage.tsv"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-coverage
          path: ${{ runner.temp }}/result/*.tsv
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: ${{ runner.temp }}/cov
          retention-days: 7
          if-no-files-found: warn

      - name: Always leave the runner sane
        if: always()
        timeout-minutes: 5
        run: sudo timeout 180 /usr/local/sbin/ufw-docker rescue || true

  matrix-table:
    # ── THE README STATUS TABLE ────────────────────────────────────────────
    # Collects every job's result row and rewrites the block between the
    # markers in README.md.
    #
    # The cells are text rather than badge images because a badge carries one
    # bit, and one bit is what already failed here -- two green runs with the
    # rootless phase skipped on all ten legs. See tests/render-matrix.sh.
    needs: [ shellcheck, bats, distro, coverage ]
    # always(), or the table would only ever record runs in which nothing
    # failed -- and a status table that cannot show a failure is decoration.
    # Restricted to pushes on main: a PR must not write to the branch, and the
    # workflow_call from release.yml should publish nothing.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Two pushes landing together would otherwise race to commit the same
    # file. Serialise, and do not cancel: the later run has the newer results.
    concurrency:
      group: matrix-table
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Render the table
        run: |
          find results -name '*.tsv' -exec cat {} +
          tests/render-matrix.sh results README.md

      - name: Commit it, if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change to the table"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          # [skip ci] or this commit triggers the workflow that produced it,
          # which would then produce an identical table, find no diff and
          # stop -- correct, but one wasted full matrix run every push.
          git commit -m "README: test matrix for ${GITHUB_SHA:0:7} [skip ci]"
          # Rebase rather than force: a concurrent push is someone's work.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
