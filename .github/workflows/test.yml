name: test

# Unlike most suites, these tests MUTATE THE RUNNER'S FIREWALL. That is safe here
# only because the runner is ephemeral — never point this at a self-hosted runner
# you care about.
#
# ufw defaults to "allow outgoing", and the Actions agent talks outbound, so
# enabling a default-deny-incoming firewall does not cut the job off. The suite
# also calls `ufw-docker rescue` in teardown, so a failure cannot wedge the job.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: syntax
        run: |
          for f in ufw-docker tests/netns-probe.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: the operator-rule invariant actually fires
        # Proves the suite's central safety check is not vacuous. Pure logic
        # against synthetic inputs -- touches no firewall, so it belongs here
        # in the fast job rather than in bats.
        run: tests/invariant-selftest.sh

      - name: functions defined, dispatcher and usage agree
        # Gating, not advisory: this catches a helper silently dropped by a
        # refactor, which bash -n and shellcheck both pass. It has happened.
        run: tests/lint-functions.sh

      - name: shellcheck
        # Gating, not advisory. It was `|| true`, which meant it could never fail
        # the build -- and the file is clean at this level, so there is nothing
        # to grandfather in. Lower the severity rather than restoring `|| true`
        # if that ever stops being true.
        run: shellcheck -S warning ufw-docker tests/netns-probe.sh tests/run.sh tests/invariant-selftest.sh tests/lint-functions.sh

  bats:
    runs-on: ubuntu-latest
    # Was 15, and a run that failed late then spent 13 minutes in teardown got
    # CANCELLED instead of reporting -- losing the diagnostics that would have
    # explained the failure. The teardown is now bounded too (see run.sh).
    timeout-minutes: 25
    strategy:
      # Explicit legs rather than a full cross product, so each one is here on
      # purpose and the cost is visible.
      #
      #   ipv6 OFF / nft     the common production case. Docker installs its own
      #                      raw/PREROUTING DROP ahead of FORWARD, so the v6
      #                      stanza is written but never consulted.
      #   ipv6 ON  / nft     the case where the v6 stanza actually decides.
      #   ipv6 OFF / legacy  the real xtables backend, which Debian 10/11 and
      #                      older Ubuntu default to and which update-alternatives
      #                      can still select on 12. Everything this project has
      #                      ever verified ran on nf_tables, and at least one
      #                      measured behaviour differs between them (see below).
      #
      # The backend is orthogonal to IPv6, so one legacy leg proves the backend
      # and pairing it with the simpler v6-off config isolates the variable.
      fail-fast: false
      matrix:
        include:
          - docker_ipv6: false
            iptables: nft
          - docker_ipv6: true
            iptables: nft
          - docker_ipv6: false
            iptables: legacy
    name: bats (ipv6=${{ matrix.docker_ipv6 }}, iptables=${{ matrix.iptables }})
    steps:
      - uses: actions/checkout@v4

      - name: Select the iptables backend
        # FIRST, before ufw is enabled and before Docker builds any chains --
        # switching afterwards would leave rules stranded in the other backend.
        # Docker is restarted so it recreates DOCKER-USER and friends under the
        # selected one.
        #
        # Known difference this leg is expected to expose: `iptables-restore
        # --test` accepts `-j NOSUCHCHAIN` with rc=0 under nf_tables and is
        # expected to REJECT it under legacy. One test asserts the nft
        # behaviour, so if it fails here that is the finding, not a defect --
        # see tests/ufw-docker.bats.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables
          if [ "${{ matrix.iptables }}" = legacy ]; then
            sudo update-alternatives --set iptables  /usr/sbin/iptables-legacy
            sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
            sudo systemctl restart docker
            sleep 10
          fi
          iptables --version
          sudo iptables -S | head -5

      - name: Enable IPv6 in the Docker daemon
        if: matrix.docker_ipv6
        # ULA only -- the runner has no global IPv6 and does not need one. The
        # probe reaches the container through the host end of a veth, which is
        # a destination Docker has DNAT'd.
        run: |
          sudo mkdir -p /etc/docker
          echo '{"ipv6": true, "ip6tables": true, "fixed-cidr-v6": "fd00:dead:beef::/64"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 10
          docker network inspect bridge --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}'

      - name: Install ufw and bats
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ufw bats
          bats --version

      - name: Install ufw-docker
        # Installed BEFORE anything else so the suite teardown can always reach
        # it, including when a test fails early.
        run: sudo install -m 0755 ufw-docker /usr/local/sbin/ufw-docker

      # NOTE: there is deliberately no step here bringing up the container the
      # tests probe. There used to be, publishing 8089:8089, and the suite
      # relied on it -- which meant a LOCAL run had no such container and fell
      # through to whatever happened to answer on 8089. On a UISP host that is
      # unms-nginx, so the suite probed the operator's own service and deleted
      # their rule for it. setup_file now creates the container itself, on
      # 19089, so CI and local exercise the identical path. See start_testsvc().

      - name: Allow SSH and enable ufw
        # The suite asserts on an SSH rule as the canary for a half-built firewall,
        # so one must exist before it starts.
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Mark this runner as safe to disrupt
        # tests/run.sh refuses to run without this. Runners are disposable, so
        # the answer here is always yes -- but it has to be said out loud,
        # which is the whole point of the marker.
        run: sudo touch /etc/ufw-docker-tests-allowed

      - name: Run the suite
        # The suite itself takes ~2 minutes of wall clock. Anything close to
        # this limit means something is hanging, not that the tests are slow.
        timeout-minutes: 12
        env:
          # The runner's own primary address — what the netns probe targets.
          HOST_IP: ""
        run: |
          HOST_IP=$(ip -4 -br addr show scope global | awk 'NR==1{print $3}' | cut -d/ -f1)
          echo "probing $HOST_IP"
          sudo HOST_IP="$HOST_IP" tests/run.sh --tap

      - name: Firewall state on failure
        if: failure()
        run: |
          sudo ufw status verbose || true
          sudo iptables -S DOCKER-USER || true
          sudo iptables -S ufw-user-input || true
          sudo iptables -S | grep -cE '^-N ufw.*logging' || true

      - name: Always leave the runner sane
        if: always()
        # BOUNDED. This is the third rescue a failing run reaches (bats
        # teardown_file, then run.sh's trap, then here). All three were
        # unbounded, and a run whose firewall was genuinely broken spent the
        # rest of the job's time budget in them -- the suite itself finished in
        # about two minutes, then the job sat for thirteen more and was
        # cancelled, taking the diagnostics with it.
        timeout-minutes: 5
        run: sudo timeout 180 /usr/local/sbin/ufw-docker rescue || true
