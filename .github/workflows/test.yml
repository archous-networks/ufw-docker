name: test

# Unlike most suites, these tests MUTATE THE RUNNER'S FIREWALL. That is safe here
# only because the runner is ephemeral — never point this at a self-hosted runner
# you care about.
#
# ufw defaults to "allow outgoing", and the Actions agent talks outbound, so
# enabling a default-deny-incoming firewall does not cut the job off. The suite
# also calls `ufw-docker rescue` in teardown, so a failure cannot wedge the job.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: syntax
        run: |
          for f in ufw-docker tests/netns-probe.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: functions defined, dispatcher and usage agree
        # Gating, not advisory: this catches a helper silently dropped by a
        # refactor, which bash -n and shellcheck both pass. It has happened.
        run: tests/lint-functions.sh

      - name: shellcheck
        # Gating, not advisory. It was `|| true`, which meant it could never fail
        # the build -- and the file is clean at this level, so there is nothing
        # to grandfather in. Lower the severity rather than restoring `|| true`
        # if that ever stops being true.
        run: shellcheck -S warning ufw-docker tests/netns-probe.sh

  bats:
    runs-on: ubuntu-latest
    # Was 15, and a run that failed late then spent 13 minutes in teardown got
    # CANCELLED instead of reporting -- losing the diagnostics that would have
    # explained the failure. The teardown is now bounded too (see run.sh).
    timeout-minutes: 25
    strategy:
      # Both legs are real deployments, and they exercise DIFFERENT code.
      # ip6tables OFF is the common production case: Docker installs its own
      # raw/PREROUTING DROP ahead of FORWARD, so our v6 stanza is written but
      # never consulted. ip6tables ON is the case where the v6 stanza actually
      # decides. Testing only one of them would leave half the tool unproven.
      fail-fast: false
      matrix:
        docker_ipv6: [false, true]
    name: bats (docker ipv6=${{ matrix.docker_ipv6 }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable IPv6 in the Docker daemon
        if: matrix.docker_ipv6
        # ULA only -- the runner has no global IPv6 and does not need one. The
        # probe reaches the container through the host end of a veth, which is
        # a destination Docker has DNAT'd.
        run: |
          sudo mkdir -p /etc/docker
          echo '{"ipv6": true, "ip6tables": true, "fixed-cidr-v6": "fd00:dead:beef::/64"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 10
          docker network inspect bridge --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}'

      - name: Install ufw and bats
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ufw bats
          bats --version

      - name: Install ufw-docker
        # Installed BEFORE anything else so the suite teardown can always reach
        # it, including when a test fails early.
        run: sudo install -m 0755 ufw-docker /usr/local/sbin/ufw-docker

      - name: Bring up a published container to filter
        # The suite needs something listening behind a Docker-published port. Port
        # 8089 matches the port the tests probe.
        run: |
          # 1:1 ON PURPOSE. Published 8089:80 would be REMAPPED, and after DNAT
          # the rule must name the CONTAINER port -- so `ufw allow 8089` could
          # never match and the "allow opens it" tests would fail while the
          # "blocked" tests passed vacuously. That is a real property of this
          # design, covered by its own test below rather than tripped over here.
          # --restart always is REQUIRED, not tidiness: one test restarts the
          # Docker daemon, which stops a no-policy container and removes its
          # DNAT rule. Later tests then probe a port with nothing behind it and
          # fail for a reason that has nothing to do with the firewall. Invisible
          # locally, where UISP's containers are already `restart: always`.
          # --bind :: makes it dual-stack. `python -m http.server` binds
          # 0.0.0.0 by default, and a v6 probe of a v4-only listener gets a TCP
          # RST -> 000, which is indistinguishable from "correctly blocked".
          docker run -d --name testsvc --restart always -p 8089:8089 python:3-alpine \
            python -m http.server 8089 --bind ::
          sleep 5
          curl -sS -o /dev/null -w 'local probe: %{http_code}\n' http://127.0.0.1:8089/

      - name: Allow SSH and enable ufw
        # The suite asserts on an SSH rule as the canary for a half-built firewall,
        # so one must exist before it starts.
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Run the suite
        env:
          # The runner's own primary address — what the netns probe targets.
          HOST_IP: ""
        run: |
          HOST_IP=$(ip -4 -br addr show scope global | awk 'NR==1{print $3}' | cut -d/ -f1)
          echo "probing $HOST_IP"
          sudo HOST_IP="$HOST_IP" tests/run.sh --tap

      - name: Firewall state on failure
        if: failure()
        run: |
          sudo ufw status verbose || true
          sudo iptables -S DOCKER-USER || true
          sudo iptables -S ufw-user-input || true
          sudo iptables -S | grep -cE '^-N ufw.*logging' || true

      - name: Always leave the runner sane
        if: always()
        run: sudo /usr/local/sbin/ufw-docker rescue || true
